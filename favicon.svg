<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B0818"/>
  <!-- The Glow (Orange) -->
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="45" font-weight="900" fill="#ff8800" text-anchor="middle" filter="url(#orangeGlow)">N29</text>
  <!-- The Black Text -->
  <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="45" font-weight="900" fill="#0B0818" text-anchor="middle">N29</text>
</svg>
