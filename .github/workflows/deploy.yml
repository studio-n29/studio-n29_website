name: Deploy Portfolio Website

on:
  push:
    branches:
      - main  # Set this to your primary branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile and Build Static Assets
        run: npm run build

      - name: Deploy static build to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite compiles code into the 'dist' directory
          branch: gh-pages # Target hosting branch